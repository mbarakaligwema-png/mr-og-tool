<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MR OG TOOL</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 400px;
            border: 1px solid #333;
            text-align: center;
        }

        h2 {
            color: #2196F3;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #888;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background-color: #2d2d2d;
            color: white;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #2196F3;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #1976D2;
        }

        .status {
            margin-top: 20px;
            font-size: 14px;
        }

        .success {
            color: #4CAF50;
        }

        .error {
            color: #F44336;
        }

        .back-link {
            margin-top: 20px;
            display: block;
            color: #888;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            color: #2196F3;
        }
    </style>
</head>

<body>
    <div class="container" id="step1">
        <h2>RESET PASSWORD</h2>
        <p style="color: #888; font-size: 13px;">Enter your email to receive a reset code.</p>
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="example@gmail.com">
        </div>
        <button id="sendBtn" onclick="sendOTP()">SEND RESET CODE</button>
        <div id="status1" class="status"></div>
        <a href="/login" class="back-link">Back to Login</a>
    </div>

    <div class="container" id="step2" style="display: none;">
        <h2>VERIFY CODE</h2>
        <div class="input-group">
            <label>Enter 6-Digit OTP</label>
            <input type="text" id="otp" placeholder="000000">
        </div>
        <div class="input-group">
            <label>New Password</label>
            <input type="password" id="new_pass" placeholder="********">
        </div>
        <button id="resetBtn" onclick="resetPassword()">RESET PASSWORD NOW</button>
        <div id="status2" class="status"></div>
    </div>

    <script>
        let currentEmail = "";

        function sendOTP() {
            const email = document.getElementById('email').value;
            const status = document.getElementById('status1');
            const btn = document.getElementById('sendBtn');

            if (!email) return alert("Please enter email");

            currentEmail = email;
            status.className = 'status';
            status.innerText = "Sending... Please wait.";
            btn.disabled = true;

            fetch('/api/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        document.getElementById('step1').style.display = 'none';
                        document.getElementById('step2').style.display = 'block';
                    } else {
                        status.className = 'status error';
                        status.innerText = data.message;
                        btn.disabled = false;
                    }
                })
                .catch(err => {
                    status.className = 'status error';
                    status.innerText = "Connection error. Tray again.";
                    btn.disabled = false;
                });
        }

        function resetPassword() {
            const otp = document.getElementById('otp').value;
            const new_pass = document.getElementById('new_pass').value;
            const status = document.getElementById('status2');
            const btn = document.getElementById('resetBtn');

            if (!otp || !new_pass) return alert("Please fill all fields");

            status.className = 'status';
            status.innerText = "Updating... Please wait.";
            btn.disabled = true;

            fetch('/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: currentEmail,
                    otp: otp,
                    new_password: new_pass
                })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        status.className = 'status success';
                        status.innerText = data.message + " Redirecting...";
                        setTimeout(() => window.location.href = "/login?msg=updated", 2000);
                    } else {
                        status.className = 'status error';
                        status.innerText = data.message;
                        btn.disabled = false;
                    }
                })
                .catch(err => {
                    status.className = 'status error';
                    status.innerText = "Connection error. Try again.";
                    btn.disabled = false;
                });
        }
    </script>
</body>

</html>
