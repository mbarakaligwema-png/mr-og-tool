{% extends "base.html" %}

{% block title %}Login - MR OG TOOL{% endblock %}

{% block content %}
<div style="height: 100%; display: flex; align-items: center; justify-content: center; min-height: 80vh;">
    <div class="stat-card" style="max-width: 450px; width: 100%; padding: 40px; box-sizing: border-box;">
        <div class="text-center" style="margin-bottom: 30px;">
            <div class="stat-icon bg-blue" style="margin: 0 auto 20px;">
                <i class='bx bxs-user-pin' style="font-size: 2rem;"></i>
            </div>
            <h2 style="font-size: 1.8rem; margin: 0;">Welcome Back!</h2>
            <p style="color: var(--text-secondary); margin-top: 5px;">Sign in to your account</p>
        </div>

        {% if msg %}
        <div class="alert alert-success"
            style="background: rgba(76, 175, 80, 0.1); color: var(--success-color); padding: 12px; border-radius: 10px; margin-bottom: 20px; font-size: 0.9rem; border: 1px solid var(--success-color);">
            <i class='bx bx-check-circle'></i> {{ msg }}
        </div>
        {% endif %}
        

        {% if error %}
        <div class="alert alert-error"
            style="background: rgba(238, 93, 80, 0.1); color: var(--error-color); padding: 12px; border-radius: 10px; margin-bottom: 20px; font-size: 0.9rem; border: 1px solid var(--error-color);">
            <i class='bx bx-error-circle'></i> {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login">
            <div class="form-group" style="margin-bottom: 20px;">
                <label style="font-weight: 500; font-size: 0.9rem;">Username</label>
                <input type="text" name="username" required
                    style="width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid #e0e5f2; outline: none; transition: border-color 0.3s; box-sizing: border-box;">
            </div>
            <div class="form-group" style="margin-bottom: 30px;">
                <label style="font-weight: 500; font-size: 0.9rem;">Password</label>
                <input type="password" name="password" required
                    style="width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid #e0e5f2; outline: none; transition: border-color 0.3s; box-sizing: border-box;">
                
                <div style="text-align: right; margin-top: 8px;">
                    <a href="/forgot-password" style="font-size: 0.85rem; color: var(--accent-color); text-decoration: none; font-weight: bold;">Forgot Password?</a>
                </div>
            </div>
            <button type="submit" class="btn-purchase"
                style="width: 100%; border: none; cursor: pointer; background: var(--accent-color); box-shadow: 0px 4px 10px rgba(67, 24, 255, 0.23);">Login</button>
        </form>

        <p class="text-center mt-20" style="margin-top: 25px; color: var(--text-secondary); font-size: 0.9rem;">
            Don't have an account? <a href="/register"
                style="color: var(--accent-color); font-weight: bold; text-decoration: none;">Create Account</a>
        </p>
    </div>
</div>
{% endblock %}
